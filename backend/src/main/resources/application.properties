# Local H2 database: request history and accounts survive backend restarts.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/accessdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
server.port=${PORT:8080}
app.auth.manager-invite-code=${MANAGER_INVITE_CODE:}
management.endpoints.web.exposure.include=health
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
